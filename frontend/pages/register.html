<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Document Summarizer</title>

    <link
        rel="stylesheet"
        href="../css/login.css"
    >

</head>


<body>


    <div class="login-container">


        <div class="login-box">


            <!-- LOGO -->

            <div class="logo">
                📄
            </div>


            <!-- TITLE -->

            <h1>
                Create Account
            </h1>


            <!-- SUBTITLE -->

            <p class="login-subtitle">
                Create an account to save your summaries
            </p>


            <!-- USERNAME -->

            <div class="input-group">

                <label for="registerUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Enter your username"
                >

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                >

            </div>


            <!-- CREATE ACCOUNT BUTTON -->

            <button
                type="button"
                id="registerBtn"
                class="login-btn"
            >
                Create Account
            </button>


            <!-- MESSAGE -->

            <p
                id="registerMessage"
                class="login-message"
            ></p>


            <!-- DIVIDER -->

            <div class="divider">

                <span>
                    OR
                </span>

            </div>


            <!-- BACK TO LOGIN -->

            <a
                href="login.html"
                class="guest-btn"
            >
                Back to Login
            </a>


            <!-- PRIVACY TEXT -->

            <p class="privacy-text">
                Create an account to securely save and access your summary history.
            </p>


        </div>


    </div>


    <script src="../js/register.js"></script>


</body>

</html>
