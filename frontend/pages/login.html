<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Document Summarizer</title>

    <link
        rel="stylesheet"
        href="../css/login.css"
    >

</head>


<body>


    <div class="login-container">


        <div class="login-box">


            <!-- LOGO -->

            <div class="logo">
                📄
            </div>


            <!-- TITLE -->

            <h1>
                Document Summarizer
            </h1>


            <p class="login-subtitle">
                Sign in to continue
            </p>


            <!-- USERNAME -->

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Username or Email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >

            </div>


            <!-- LOGIN -->

            <button
                type="button"
                id="loginBtn"
                class="login-btn"
            >
                Login
            </button>


            <!-- MESSAGE -->

            <p
                id="loginMessage"
                class="login-message"
            ></p>


            <!-- DIVIDER -->

            <div class="divider">

                <span>
                    OR
                </span>

            </div>


            <!-- CREATE ACCOUNT -->

            <a
                href="register.html"
                class="register-link"
            >
                Create an account
            </a>


            <!-- GUEST -->

            <a
                href="/pages/app.html"
                class="guest-btn"
            >
                Continue as Guest
            </a>


            <!-- PRIVACY -->

            <p class="privacy-text">
                Your documents are secure and your privacy is our priority.
            </p>


        </div>


    </div>


    <script src="../js/login.js"></script>


</body>

</html>
